[project]
name = "core-banking"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    "pydantic>=2",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "common",
    "bank-logging",
    "messaging",
    "auth-client",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.sources]
common = { workspace = true }
bank-logging = { workspace = true }
messaging = { workspace = true }
auth-client = { workspace = true }
