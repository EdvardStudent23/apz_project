[project]
name = "auth"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    "pydantic>=2",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "common",
    "bank-logging",
    "messaging",
    "auth-client",
]

[tool.uv]
package = false

[tool.uv.sources]
common = { workspace = true }
bank-logging = { workspace = true }
messaging = { workspace = true }
auth-client = { workspace = true }
