[project]
name = "apz-bank"
version = "0.0.0"
description = "Microservices-based digital bank monorepo"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/common",
    "libs/logging",
    "libs/messaging",
    "libs/auth_client",
    "services/_template",
    "services/auth",
    "services/core_banking",
    "services/history",
    "services/bankmarket",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "FA"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/**" = ["N999", "FA"]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "failover: marks tests that stop/start Docker containers (require full stack)",
]
