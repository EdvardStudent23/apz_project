# NanoBank API Gateway
# Single ingress on port 8080. Auth Service is load-balanced across two
# replicas (least_conn). All other services have one replica each.

upstream auth {
    least_conn;
    server auth_1:8001;
    server auth_2:8001;
}

upstream core_banking {
    server core_banking:8000;
}

upstream history {
    server history:8000;
}

upstream bankmarket {
    server bankmarket:8000;
}

server {
    listen 8080;
    server_name _;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Propagate or generate a request-id for distributed tracing.
    # If the client sends one, forward it; otherwise nginx passes an empty string
    # and the service middleware will generate a new UUID.
    proxy_set_header X-Request-Id      $http_x_request_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    # ── Static Web UI ──────────────────────────────────────────────────────────
    location = / {
        root /app/web;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /web/ {
        root /app;
        try_files $uri =404;
    }

    # ── Auth Service (/auth/* and /.well-known/*) ─────────────────────────────
    # Routes to the least-conn upstream over both replicas.
    # Does NOT strip the /auth prefix — the FastAPI router expects it.
    location /auth/ {
        proxy_pass http://auth;
    }

    # JWKS endpoint — other services call this at startup to fetch the public key
    location /.well-known/ {
        proxy_pass http://auth;
    }

    # Auth health (exposed so Nginx itself can check replicas if needed)
    location = /health/auth {
        proxy_pass http://auth/health;
    }

    # ── Core Banking (/accounts, /transfers) ─────────────────────────────────
    location /accounts {
        proxy_pass http://core_banking;
    }

    location /transfers {
        proxy_pass http://core_banking;
    }

    # ── History Service (/history) ────────────────────────────────────────────
    location /history {
        proxy_pass http://history;
    }

    # ── BankMarket (/market/*) ────────────────────────────────────────────────
    location /market/ {
        proxy_pass http://bankmarket;
    }

    # ── Gateway health probe ──────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
