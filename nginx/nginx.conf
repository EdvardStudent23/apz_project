worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # ─── Upstreams ────────────────────────────────────────────────────────────
    # Auth Service – two instances for High Availability
    upstream auth_service {
        least_conn;
        server auth-service-1:8001 max_fails=3 fail_timeout=10s;
        server auth-service-2:8001 max_fails=3 fail_timeout=10s;
    }

    upstream core_banking_service {
        server core-banking-service:8002;
    }

    upstream history_service {
        server history-service:8003;
    }

    upstream bank_market_service {
        server bank-market-service:8004;
    }

    # ─── JWT validation helper (internal) ────────────────────────────────────
    # We delegate JWT verification to auth service for protected routes.
    # The auth service exposes GET /auth/validate that returns 200 or 401.

    server {
        listen 80;
        server_name _;

        # ── Auth endpoints (public – no JWT required) ──────────────────────
        location /auth/ {
            proxy_pass         http://auth_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Core Banking (protected) ───────────────────────────────────────
        location /banking/ {
            auth_request        /internal/auth/validate;
            auth_request_set    $auth_user_id $upstream_http_x_user_id;

            proxy_pass          http://core_banking_service/;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-User-ID         $auth_user_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            error_page 401 = @unauthorized;
        }

        # ── History (protected) ────────────────────────────────────────────
        location /history/ {
            auth_request        /internal/auth/validate;
            auth_request_set    $auth_user_id $upstream_http_x_user_id;

            proxy_pass          http://history_service/;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-User-ID         $auth_user_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            error_page 401 = @unauthorized;
        }

        # ── BankMarket (protected) ─────────────────────────────────────────
        location /market/ {
            auth_request        /internal/auth/validate;
            auth_request_set    $auth_user_id $upstream_http_x_user_id;

            proxy_pass          http://bank_market_service/;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-User-ID         $auth_user_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            error_page 401 = @unauthorized;
        }

        # ── Internal: JWT validation sub-request ──────────────────────────
        # Nginx sends the original Authorization header to auth service.
        # Auth service returns 200 + X-User-ID header on success, 401 on fail.
        location = /internal/auth/validate {
            internal;
            proxy_pass          http://auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header    Content-Length    "";
            proxy_set_header    X-Original-URI    $request_uri;
            proxy_set_header    Authorization     $http_authorization;
        }

        # ── 401 JSON response ──────────────────────────────────────────────
        location @unauthorized {
            default_type application/json;
            return 401 '{"error": "Unauthorized", "message": "Valid JWT token is required"}';
        }

        # ── Health check ───────────────────────────────────────────────────
        location /health {
            default_type application/json;
            return 200 '{"status": "ok", "service": "api-gateway"}';
        }
    }
}
