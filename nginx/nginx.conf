# NanoBank API Gateway
# Single ingress on port 8080. Auth Service is load-balanced across two
# replicas (least_conn). All other services have one replica each.

# `max_fails` + `fail_timeout` short-circuit subsequent requests to a downed
# upstream — instead of every request paying the full proxy_connect_timeout,
# nginx briefly marks the peer dead and returns 502 immediately. For the
# two-replica auth upstream this means a dead replica is bypassed quickly,
# leaving the other to serve.
upstream auth {
    least_conn;
    server auth_1:8001 max_fails=1 fail_timeout=5s;
    server auth_2:8001 max_fails=1 fail_timeout=5s;
}

upstream core_banking {
    server core_banking:8000 max_fails=1 fail_timeout=5s;
}

upstream history {
    server history:8000 max_fails=1 fail_timeout=5s;
}

upstream bankmarket {
    server bankmarket:8000 max_fails=1 fail_timeout=5s;
}

upstream web {
    server web:80 max_fails=1 fail_timeout=5s;
}

server {
    listen 8080;
    server_name _;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Propagate or generate a request-id for distributed tracing.
    # If the client sends one, forward it; otherwise nginx passes an empty string
    # and the service middleware will generate a new UUID.
    proxy_set_header X-Request-Id      $http_x_request_id;

    # Short timeouts so a stopped backend service surfaces quickly as a 502/504
    # and the SPA can show the "services temporarily unavailable" banner
    # instead of the user staring at a spinner.
    proxy_connect_timeout 3s;
    proxy_send_timeout    5s;
    proxy_read_timeout    10s;

    # ── Auth Service (/auth/* and /.well-known/*) ─────────────────────────────
    # Routes to the least-conn upstream over both replicas.
    # Does NOT strip the /auth prefix — the FastAPI router expects it.
    location /auth/ {
        proxy_pass http://auth;
    }

    # JWKS endpoint — other services call this at startup to fetch the public key
    location /.well-known/ {
        proxy_pass http://auth;
    }

    # Auth health (exposed so Nginx itself can check replicas if needed)
    location = /health/auth {
        proxy_pass http://auth/health;
    }

    # ── Core Banking (/accounts, /transfers) ─────────────────────────────────
    location /accounts {
        proxy_pass http://core_banking;
    }

    location /transfers {
        proxy_pass http://core_banking;
    }

    # ── History Service (/history) ────────────────────────────────────────────
    location /history {
        proxy_pass http://history;
    }

    # ── BankMarket (/market/*) ────────────────────────────────────────────────
    location /market/ {
        proxy_pass http://bankmarket;
    }

    # ── Gateway health probe ──────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Web SPA (catch-all) ──────────────────────────────────────────────────
    # Everything that doesn't match an API location above goes to the React app.
    # The `web` container's own nginx handles SPA fallback to index.html.
    location / {
        proxy_pass http://web;
    }
}
