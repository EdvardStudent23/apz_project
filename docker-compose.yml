version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NanoBank – Full System Docker Compose
# Person #1 owns this file (API Gateway & DevOps)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  nanobank-net:
    driver: bridge

volumes:
  auth-pg-data:
  banking-pg-data:
  rabbitmq-data:
  redis-data:
  mongo-primary-data:
  mongo-secondary1-data:
  mongo-secondary2-data:
  neo4j-data:

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. API GATEWAY (Nginx)
  # ═══════════════════════════════════════════════════════════════════════════
  api-gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "80:80"
    depends_on:
      auth-service-1:
        condition: service_healthy
      auth-service-2:
        condition: service_healthy
      core-banking-service:
        condition: service_healthy
      history-service:
        condition: service_healthy
      bank-market-service:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. AUTH SERVICE – instance 1  (High Availability)
  # ═══════════════════════════════════════════════════════════════════════════
  auth-service-1:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service-1
    environment:
      - INSTANCE_ID=1
      - DATABASE_URL=postgresql://nanobank:nanobank@auth-postgres:5432/authdb
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_in_production}
      - JWT_EXPIRE_MINUTES=60
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # 2b. AUTH SERVICE – instance 2  (High Availability duplicate)
  # ═══════════════════════════════════════════════════════════════════════════
  auth-service-2:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service-2
    environment:
      - INSTANCE_ID=2
      - DATABASE_URL=postgresql://nanobank:nanobank@auth-postgres:5432/authdb
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_in_production}
      - JWT_EXPIRE_MINUTES=60
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. CORE BANKING SERVICE
  # ═══════════════════════════════════════════════════════════════════════════
  core-banking-service:
    build:
      context: ./core-banking-service
      dockerfile: Dockerfile
    container_name: core-banking-service
    environment:
      - DATABASE_URL=Host=banking-postgres;Port=5432;Database=bankingdb;Username=nanobank;Password=nanobank
      - RABBITMQ_URL=amqp://nanobank:nanobank@rabbitmq:5672/
    depends_on:
      banking-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. HISTORY SERVICE
  # ═══════════════════════════════════════════════════════════════════════════
  history-service:
    build:
      context: ./history-service
      dockerfile: Dockerfile
    container_name: history-service
    environment:
      - MONGODB_URI=mongodb://mongo-primary:27017,mongo-secondary1:27017,mongo-secondary2:27017/historydb?replicaSet=rs0
      - RABBITMQ_URL=amqp://nanobank:nanobank@rabbitmq:5672/
    depends_on:
      mongo-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. BANK MARKET SERVICE
  # ═══════════════════════════════════════════════════════════════════════════
  bank-market-service:
    build:
      context: ./bank-market-service
      dockerfile: Dockerfile
    container_name: bank-market-service
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-nano_neo4j_pass}
      - RABBITMQ_URL=amqp://nanobank:nanobank@rabbitmq:5672/
      - CORE_BANKING_URL=http://core-banking-service:8002
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE – PostgreSQL for Auth Service
  # ═══════════════════════════════════════════════════════════════════════════
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: nanobank
      POSTGRES_PASSWORD: nanobank
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobank -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE – PostgreSQL for Core Banking Service
  # ═══════════════════════════════════════════════════════════════════════════
  banking-postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: nanobank
      POSTGRES_PASSWORD: nanobank
    volumes:
      - banking-pg-data:/var/lib/postgresql/data
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobank -d bankingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE – Redis (shared session store for Auth HA)
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE – RabbitMQ (message broker)
  # ═══════════════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nanobank
      RABBITMQ_DEFAULT_PASS: nanobank
    ports:
      - "15672:15672"   # Management UI (dev only)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE – MongoDB Replica Set (Primary)
  # ═══════════════════════════════════════════════════════════════════════════
  mongo-primary:
    image: mongo:7
    container_name: mongo-primary
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo-primary-data:/data/db
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-secondary1:
    image: mongo:7
    container_name: mongo-secondary1
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo-secondary1-data:/data/db
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-secondary2:
    image: mongo:7
    container_name: mongo-secondary2
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo-secondary2-data:/data/db
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot container to initialise the MongoDB replica set
  mongo-init:
    image: mongo:7
    container_name: mongo-init
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary1:
        condition: service_healthy
      mongo-secondary2:
        condition: service_healthy
    networks:
      - nanobank-net
    restart: "no"
    entrypoint: >
      mongosh --host mongo-primary --eval
      "rs.initiate({
        _id: 'rs0',
        members: [
          { _id: 0, host: 'mongo-primary:27017',   priority: 2 },
          { _id: 1, host: 'mongo-secondary1:27017', priority: 1 },
          { _id: 2, host: 'mongo-secondary2:27017', priority: 1 }
        ]
      })"

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE – Neo4j (Graph DB for BankMarket)
  # ═══════════════════════════════════════════════════════════════════════════
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nano_neo4j_pass}
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"   # Browser UI (dev only)
    networks:
      - nanobank-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
