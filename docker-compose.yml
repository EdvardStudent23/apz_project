# NanoBank — full-stack Docker Compose
# Owned by Person #1 (DevOps).
#
# Usage:
#   make up          # start everything
#   make down        # stop and remove containers (volumes preserved)
#   make logs SVC=auth_1   # tail one service

networks:
  bank_net:
    driver: bridge

volumes:
  auth_db_data:
  core_banking_db_data:
  redis_data:
  mongo_1_data:
  mongo_2_data:
  mongo_3_data:
  neo4j_data:
  rabbitmq_data:

# ── Infrastructure services ───────────────────────────────────────────────────
services:

  # --------------------------------------------------------------------------
  # Databases
  # --------------------------------------------------------------------------

  auth_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_secret
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - bank_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  core_banking_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_secret
    volumes:
      - core_banking_db_data:/var/lib/postgresql/data
    networks:
      - bank_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d core_banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - bank_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB replica set — 1 primary + 2 secondaries (course requirement)
  mongo_1:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_1_data:/data/db
    networks:
      - bank_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongo_2:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_2_data:/data/db
    networks:
      - bank_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongo_3:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_3_data:/data/db
    networks:
      - bank_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot init container — runs rs.initiate() once all three nodes are healthy
  mongo_init:
    image: mongo:7
    networks:
      - bank_net
    depends_on:
      mongo_1:
        condition: service_healthy
      mongo_2:
        condition: service_healthy
      mongo_3:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo_1:27017 --eval
      'try { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo_1:27017"},{_id:1,host:"mongo_2:27017"},{_id:2,host:"mongo_3:27017"}]}) } catch(e) { if (e.message.includes("already initialized")) { print("Replica set already initialized"); } else { throw e; } }'

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/neo4j_secret
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # Bolt
    networks:
      - bank_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"   # management UI
    networks:
      - bank_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------
  # Application services
  # --------------------------------------------------------------------------

  auth_1:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      POSTGRES_HOST: auth_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: "change-me-in-production-use-env-file"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      APP_PORT: 8001
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
    ports:
      - "8001:8001"
    networks:
      - bank_net
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth_2:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      POSTGRES_HOST: auth_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: "change-me-in-production-use-env-file"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      APP_PORT: 8001
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
    ports:
      - "8002:8001"
    networks:
      - bank_net
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot migration container — applies Alembic head before core_banking starts.
  # Required: without this, the app starts against an empty database and every
  # /accounts and /transfers call returns 500.
  core_banking_migrate:
    build:
      context: .
      dockerfile: services/core_banking/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://banking_user:banking_secret@core_banking_db:5432/core_banking
    networks:
      - bank_net
    depends_on:
      core_banking_db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  core_banking:
    build:
      context: .
      dockerfile: services/core_banking/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://banking_user:banking_secret@core_banking_db:5432/core_banking
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672/
      AUTH_JWKS_URL: http://auth_1:8001/.well-known/jwks.json
    ports:
      - "8003:8000"
    networks:
      - bank_net
    depends_on:
      core_banking_migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      auth_1:
        condition: service_started
    restart: unless-stopped

  history:
    build:
      context: .
      dockerfile: services/history/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo_1:27017,mongo_2:27017,mongo_3:27017/?replicaSet=rs0
      MONGO_DB: history
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672/
      AUTH_JWKS_URL: http://auth_1:8001/.well-known/jwks.json
    ports:
      - "8004:8000"
    networks:
      - bank_net
    depends_on:
      mongo_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      auth_1:
        condition: service_started
    restart: unless-stopped

  bankmarket:
    build:
      context: .
      dockerfile: services/bankmarket/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_secret
      CORE_BANKING_URL: http://core_banking:8000
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672/
      AUTH_JWKS_URL: http://auth_1:8001/.well-known/jwks.json
    ports:
      - "8005:8000"
    networks:
      - bank_net
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      core_banking:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Web UI (React + Vite, served by its own nginx)
  # --------------------------------------------------------------------------

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    networks:
      - bank_net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # API Gateway
  # --------------------------------------------------------------------------

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    networks:
      - bank_net
    depends_on:
      auth_1:
        condition: service_started
      auth_2:
        condition: service_started
      core_banking:
        condition: service_started
      history:
        condition: service_started
      bankmarket:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped
