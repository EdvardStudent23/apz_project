<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5bd6" />
    <title>NanoBank</title>
    <script>
      // Apply persisted theme before React mounts to avoid a light flash on
      // first paint. Mirrors the logic in src/theme/ThemeContext.tsx.
      (function () {
        try {
          var pref = localStorage.getItem('nanobank.theme');
          if (pref === 'dark' || pref === 'light') {
            document.documentElement.setAttribute('data-theme', pref);
          }
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
